<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>App Code & Link Hub</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --card-2: #0b1220;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent-2: #22c55e;
      --danger: #ef4444;
      --border: rgba(148, 163, 184, 0.18);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding-bottom: 84px;
    }

    /* Lock Screen */
    #lockScreen {
      position: fixed;
      inset: 0;
      background: var(--bg);
      z-index: 999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }

    .lock-box {
      width: 100%;
      max-width: 340px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 24px;
    }

    .lock-box h2 {
      margin-bottom: 8px;
      font-size: 20px;
    }

    .lock-box p {
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 18px;
    }

    .pin-input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--card-2);
      color: var(--text);
      font-size: 18px;
      letter-spacing: 6px;
      text-align: center;
      margin-bottom: 12px;
      outline: none;
    }

    .btn {
      width: 100%;
      padding: 11px 14px;
      border: none;
      border-radius: 12px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      transition: 0.15s ease;
    }

    .btn-primary {
      background: var(--accent);
      color: #062033;
    }

    .btn-green {
      background: var(--accent-2);
      color: #052e16;
    }

    .btn-danger {
      background: var(--danger);
      color: #fff;
    }

    .btn-ghost {
      background: rgba(148, 163, 184, 0.14);
      color: var(--text);
    }

    .error-text {
      color: #f87171;
      font-size: 12px;
      margin-top: 8px;
      min-height: 16px;
    }

    /* Header */
    header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .brand {
      display: flex;
      flex-direction: column;
    }

    .brand h1 {
      font-size: 17px;
      font-weight: 700;
    }

    .sync-status {
      font-size: 11px;
      color: var(--muted);
      margin-top: 2px;
    }

    .header-actions {
      display: flex;
      gap: 8px;
    }

    .icon-btn {
      padding: 8px 10px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      font-size: 12px;
      cursor: pointer;
    }

    /* Main Content */
    main {
      max-width: 720px;
      margin: 0 auto;
      padding: 16px;
    }

    .section-title {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 12px;
      color: var(--accent);
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 12px;
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 8px;
    }

    .item-title {
      font-size: 15px;
      font-weight: 700;
      word-break: break-word;
    }

    .badge {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 999px;
      background: rgba(56, 189, 248, 0.16);
      color: var(--accent);
      white-space: nowrap;
    }

    .item-link {
      display: block;
      font-size: 12px;
      color: #7dd3fc;
      text-decoration: none;
      word-break: break-all;
      margin-bottom: 10px;
    }

    .code-box {
      background: var(--card-2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 12px;
      color: #e2e8f0;
      max-height: 150px;
      overflow: auto;
      white-space: pre-wrap;
      word-break: break-word;
      margin-bottom: 10px;
    }

    .card-actions {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .card-actions button {
      padding: 8px;
      border-radius: 10px;
      border: none;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    /* Form */
    .form-group {
      margin-bottom: 12px;
    }

    .form-group label {
      display: block;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .form-control {
      width: 100%;
      padding: 11px 12px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--card-2);
      color: var(--text);
      font-size: 14px;
      outline: none;
    }

    textarea.form-control {
      min-height: 130px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 12px;
      resize: vertical;
    }

    .empty-state {
      text-align: center;
      color: var(--muted);
      padding: 36px 16px;
      background: var(--card);
      border: 1px dashed var(--border);
      border-radius: 16px;
      font-size: 14px;
    }

    /* Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(2, 6, 23, 0.8);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 100;
    }

    .modal-backdrop.active {
      display: flex;
    }

    .modal {
      width: 100%;
      max-width: 640px;
      max-height: 85vh;
      overflow-y: auto;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 18px;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .modal-header h3 {
      font-size: 16px;
    }

    /* Bottom Nav */
    nav.bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(12px);
      border-top: 1px solid var(--border);
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      padding: 8px 6px;
      z-index: 30;
    }

    .nav-btn {
      background: transparent;
      border: none;
      color: var(--muted);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      font-weight: 600;
      padding: 6px 4px;
      border-radius: 10px;
      cursor: pointer;
    }

    .nav-btn.active {
      color: var(--accent);
      background: rgba(56, 189, 248, 0.12);
    }

    .toast {
      position: fixed;
      bottom: 78px;
      left: 50%;
      transform: translateX(-50%);
      background: #0284c7;
      color: #fff;
      padding: 9px 16px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
      z-index: 200;
    }

    .toast.show {
      opacity: 1;
    }
  </style>
</head>
<body>

  <!-- PIN Lock Screen -->
  <div id="lockScreen">
    <div class="lock-box">
      <h2>Locked Hub</h2>
      <p>Enter PIN to access your saved links & HTML code</p>
      <input type="password" id="pinInput" class="pin-input" maxlength="8" placeholder="••••" />
      <button class="btn btn-primary" onclick="unlockHub()">Unlock</button>
      <div id="pinError" class="error-text"></div>
    </div>
  </div>

  <!-- Header -->
  <header>
    <div class="brand">
      <h1>Code & Link Hub</h1>
      <div id="syncStatus" class="sync-status">Connecting to Firebase...</div>
    </div>
    <div class="header-actions">
      <button class="icon-btn" onclick="changePinPrompt()">PIN</button>
      <button class="icon-btn" onclick="lockHub()">Lock</button>
    </div>
  </header>

  <!-- Main Content -->
  <main id="mainContainer"></main>

  <!-- Code Viewer Modal -->
  <div id="codeModal" class="modal-backdrop">
    <div class="modal">
      <div class="modal-header">
        <h3 id="modalTitle">HTML Code Viewer</h3>
        <button class="icon-btn" onclick="closeModal()">Close</button>
      </div>
      <div id="modalCode" class="code-box" style="max-height: 55vh;"></div>
      <button class="btn btn-primary" onclick="copyModalCode()">Copy HTML Code</button>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast"></div>

  <!-- Bottom Navigation -->
  <nav class="bottom-nav">
    <button class="nav-btn active" data-tab="Web" onclick="switchTab('Web')">
      <span>🌐</span>
      <span>Web</span>
    </button>
    <button class="nav-btn" data-tab="Web + Android" onclick="switchTab('Web + Android')">
      <span>🤖</span>
      <span>Web+Android</span>
    </button>
    <button class="nav-btn" data-tab="Web + Telegram" onclick="switchTab('Web + Telegram')">
      <span>✈️</span>
      <span>Web+Telegram</span>
    </button>
    <button class="nav-btn" data-tab="Create" onclick="switchTab('Create')">
      <span>➕</span>
      <span>Create</span>
    </button>
  </nav>

  <!-- Firebase Realtime Database (Compat SDK for single-file reliability) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

  <script>
    // Your Firebase Configuration (my-code-vault)
    const firebaseConfig = {
      apiKey: "AIzaSyCwTR0kZ261Iv1IViaxsQgcvUpX4mVvwWk",
      authDomain: "my-code-vault-d1c7f.firebaseapp.com",
      databaseURL: "https://my-code-vault-d1c7f-default-rtdb.firebaseio.com",
      projectId: "my-code-vault-d1c7f",
      storageBucket: "my-code-vault-d1c7f.firebasestorage.app",
      messagingSenderId: "930923646767",
      appId: "1:930923646767:web:8fb921c98bd2f72c031bda",
      measurementId: "G-2CQFDZH4G6"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const itemsRef = db.ref("hubItems");

    const LOCAL_ITEMS_KEY = "hub_items_backup_v1";
    const LOCAL_PIN_KEY = "hub_pin_v1";

    let currentTab = "Web";
    let hubItems = [];
    let currentModalCode = "";

    function showToast(message) {
      const toast = document.getElementById("toast");
      toast.textContent = message;
      toast.classList.add("show");
      setTimeout(() => toast.classList.remove("show"), 2200);
    }

    function setSyncStatus(text, isOnline = true) {
      const el = document.getElementById("syncStatus");
      el.textContent = text;
      el.style.color = isOnline ? "#4ade80" : "#f87171";
    }

    // PIN Management
    function getSavedPin() {
      return localStorage.getItem(LOCAL_PIN_KEY) || "1234";
    }

    function unlockHub() {
      const input = document.getElementById("pinInput");
      const error = document.getElementById("pinError");
      if (input.value.trim() === getSavedPin()) {
        document.getElementById("lockScreen").style.display = "none";
        input.value = "";
        error.textContent = "";
        render();
      } else {
        error.textContent = "Incorrect PIN. Try again.";
      }
    }

    function lockHub() {
      document.getElementById("lockScreen").style.display = "flex";
    }

    function changePinPrompt() {
      const newPin = prompt("Enter new PIN (4-8 digits):", getSavedPin());
      if (newPin && newPin.trim().length >= 4) {
        localStorage.setItem(LOCAL_PIN_KEY, newPin.trim());
        showToast("PIN updated");
      } else if (newPin !== null) {
        showToast("PIN must be at least 4 characters");
      }
    }

    // Load local backup first, then listen to Firebase Realtime Database
    function initDataListeners() {
      try {
        const cached = JSON.parse(localStorage.getItem(LOCAL_ITEMS_KEY) || "[]");
        if (Array.isArray(cached)) {
          hubItems = cached;
        }
      } catch (e) {}

      itemsRef.on(
        "value",
        (snapshot) => {
          const data = snapshot.val();
          if (data && typeof data === "object") {
            hubItems = Object.entries(data).map(([id, val]) => ({
              id,
              name: val.name || "Untitled",
              category: val.category || "Web",
              link: val.link || "",
              code: val.code || "",
              createdAt: val.createdAt || 0
            }));
            hubItems.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
          } else {
            hubItems = [];
          }
          localStorage.setItem(LOCAL_ITEMS_KEY, JSON.stringify(hubItems));
          setSyncStatus("Firebase Connected • Synced", true);
          render();
        },
        (error) => {
          console.error(error);
          setSyncStatus("Firebase Sync Issue (Using Local Cache)", false);
          render();
        }
      );
    }

    function switchTab(tabName) {
      currentTab = tabName;
      document.querySelectorAll(".nav-btn").forEach((btn) => {
        btn.classList.toggle("active", btn.dataset.tab === tabName);
      });
      render();
    }

    function escapeHtml(str) {
      return String(str || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function render() {
      const container = document.getElementById("mainContainer");
      if (!container) return;

      if (currentTab === "Create") {
        container.innerHTML = `
          <div class="section-title">Create New Entry</div>
          <form class="card" onsubmit="saveNewItem(event)">
            <div class="form-group">
              <label for="itemName">Name / Title *</label>
              <input id="itemName" class="form-control" type="text" placeholder="e.g. My WebView App" required />
            </div>

            <div class="form-group">
              <label for="itemCategory">Category *</label>
              <select id="itemCategory" class="form-control">
                <option value="Web">Web</option>
                <option value="Web + Android">Web + Android</option>
                <option value="Web + Telegram">Web + Telegram</option>
              </select>
            </div>

            <div class="form-group">
              <label for="itemLink">URL / Link</label>
              <input id="itemLink" class="form-control" type="text" placeholder="https://example.com" />
            </div>

            <div class="form-group">
              <label for="itemCode">HTML / Embed Code</label>
              <textarea id="itemCode" class="form-control" placeholder="Paste your HTML code here..."></textarea>
            </div>

            <button type="submit" class="btn btn-green">Save to Firebase</button>
          </form>
        `;
        return;
      }

      const filtered = hubItems.filter((item) => item.category === currentTab);

      let html = `<div class="section-title">${escapeHtml(currentTab)} Items (${filtered.length})</div>`;

      if (filtered.length === 0) {
        html += `<div class="empty-state">No items in <b>${escapeHtml(currentTab)}</b> yet. Tap <b>Create</b> below to add one.</div>`;
      } else {
        filtered.forEach((item) => {
          html += `
            <div class="card">
              <div class="card-top">
                <div class="item-title">${escapeHtml(item.name)}</div>
                <span class="badge">${escapeHtml(item.category)}</span>
              </div>
              ${item.link ? `<a class="item-link" href="${escapeHtml(item.link)}" target="_blank" rel="noopener noreferrer">${escapeHtml(item.link)}</a>` : ""}
              ${item.code ? `<div class="code-box">${escapeHtml(item.code)}</div>` : ""}
              <div class="card-actions">
                <button class="btn-primary" onclick="openCodeModal('${escapeHtml(item.id)}')">View Code</button>
                <button class="btn-ghost" onclick="copyItemCode('${escapeHtml(item.id)}')">Copy Code</button>
                <button class="btn-danger" onclick="deleteItem('${escapeHtml(item.id)}')">Delete</button>
              </div>
            </div>
          `;
        });
      }

      container.innerHTML = html;
    }

    async function saveNewItem(event) {
      event.preventDefault();
      const name = document.getElementById("itemName").value.trim();
      const category = document.getElementById("itemCategory").value;
      const link = document.getElementById("itemLink").value.trim();
      const code = document.getElementById("itemCode").value;

      if (!name) return;

      const payload = {
        name,
        category,
        link,
        code,
        createdAt: Date.now()
      };

      try {
        setSyncStatus("Saving to Firebase...", true);
        await itemsRef.push(payload);
        showToast("Saved to Firebase!");
        switchTab(category);
      } catch (err) {
        console.error(err);
        showToast("Failed to save. Check Firebase Rules.");
        setSyncStatus("Save Failed", false);
      }
    }

    function openCodeModal(id) {
      const item = hubItems.find((x) => x.id === id);
      if (!item) return;
      currentModalCode = item.code || "";
      document.getElementById("modalTitle").textContent = item.name || "HTML Code";
      document.getElementById("modalCode").textContent = item.code || "// No HTML code saved";
      document.getElementById("codeModal").classList.add("active");
    }

    function closeModal() {
      document.getElementById("codeModal").classList.remove("active");
    }

    function copyText(text) {
      if (!text) {
        showToast("Nothing to copy");
        return;
      }
      navigator.clipboard
        .writeText(text)
        .then(() => showToast("Copied to clipboard"))
        .catch(() => showToast("Copy failed"));
    }

    function copyModalCode() {
      copyText(currentModalCode);
    }

    function copyItemCode(id) {
      const item = hubItems.find((x) => x.id === id);
      copyText(item ? item.code : "");
    }

    async function deleteItem(id) {
      if (!confirm("Delete this item permanently from Firebase?")) return;
      try {
        await itemsRef.child(id).remove();
        showToast("Deleted from Firebase");
      } catch (err) {
        console.error(err);
        showToast("Delete failed");
      }
    }

    document.getElementById("pinInput").addEventListener("keydown", (e) => {
      if (e.key === "Enter") unlockHub();
    });

    initDataListeners();
  </script>
</body>
</html>
